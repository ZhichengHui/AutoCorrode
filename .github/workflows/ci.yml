# SPDX-License-Identifier: MIT

name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-markdown-link:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # v1.0.17

  build:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2026
      options: --user root

    steps:
      - name: Checkout AutoCorrode
        uses: actions/checkout@v3

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action

      - name: Build AutoCorrode
        run: |
          $ISABELLE_HOME/bin/isabelle build -v -b -d . \
            -d $AFP_COMPONENT_BASE/Word_Lib \
            AutoCorrode

  tutorial-build:
    runs-on: ubuntu-latest
    container:
      # _X11_Latex variant ships TeX Live, which is needed because the
      # tutorial session builds a Beamer PDF.
      image: makarius/isabelle:Isabelle2026_X11_Latex
      options: --user root

    steps:
      - name: Checkout AutoCorrode
        uses: actions/checkout@v3

      - name: Setup Isabelle
        uses: ./.github/actions/setup-isabelle-action

      - name: Install make and lualatex
        run: |
          apt-get update -qq
          # texlive-luatex provides lualatex, used by Isabelle's document
          # builder for Beamer documents.
          apt-get install -y -qq --no-install-recommends make texlive-luatex > /dev/null

      # `make build` builds the AutoCorrode parent heap (which the Tests and
      # tutorial sessions inherit); `make tests` then checks the Tests session
      # and `make tutorial` builds the slide-deck PDF.
      # The Makefile expects ISABELLE_HOME to point at the bin directory.
      - name: Build AutoCorrode, tests and tutorial
        run: |
          make ISABELLE_HOME=$ISABELLE_HOME/bin AFP_COMPONENT_BASE=$AFP_COMPONENT_BASE build tests tutorial

      - name: Upload tutorial PDF
        uses: actions/upload-artifact@v4
        with:
          name: autocorrode-tutorial
          path: tutorial/autocorrode_tutorial.pdf
          if-no-files-found: error
